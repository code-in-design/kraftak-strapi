name: Fix SMTP (manual)

on:
  workflow_dispatch:

env:
  EC2_HOST: 13.209.112.166
  EC2_USER: ec2-user

jobs:
  fix-smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts 2>&1
          chmod 644 ~/.ssh/known_hosts

      - name: Update SMTP_PASS, restart PM2, re-verify
        env:
          NEW_PASS: ${{ secrets.SMTP_PASS_FIX }}
        run: |
          B64=$(printf '%s' "$NEW_PASS" | base64 -w0)
          cat > fixcheck.js <<'JS'
          const fs = require("fs");
          const env = Object.fromEntries(
            fs.readFileSync(".env", "utf8").split("\n").filter((l) => l.includes("="))
              .map((l) => { const i = l.indexOf("="); return [l.slice(0, i).trim(), l.slice(i + 1).trim().replace(/^["']|["']$/g, "")]; })
          );
          const nodemailer = require("nodemailer");
          const t = nodemailer.createTransport({ host: env.SMTP_HOST, port: Number(env.SMTP_PORT), secure: true, auth: { user: env.SMTP_USER, pass: (env.SMTP_PASS || "").replace(/ /g, "") } });
          (async () => {
            console.log("SMTP_USER:", env.SMTP_USER, "| ADMIN_EMAIL:", env.ADMIN_EMAIL || "(unset)", "| FROM:", env.SMTP_DEFAULT_FROM || "(unset)");
            try { await t.verify(); console.log("VERIFY: OK"); } catch (e) { console.log("VERIFY: FAIL", e.responseCode || e.code, e.message); return; }
            try { const i = await t.sendMail({ from: env.SMTP_DEFAULT_FROM || env.SMTP_USER, to: "ceo@codeindesign.kr", subject: "[메일발송 점검] kraftak 서버 SMTP 복구 확인", text: "kraftak 서버 SMTP 복구 후 발송이 정상 동작하는지 확인용 (코드인디자인)" }); console.log("SEND: OK", i.messageId, JSON.stringify(i.accepted)); } catch (e) { console.log("SEND: FAIL", e.responseCode || e.code, e.message); }
          })();
          JS
          JSB64=$(base64 -w0 fixcheck.js)
          ssh ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "cd ~/kraftak-strapi && cp .env .env.bak.\$(date +%s) && NP=\$(echo $B64 | base64 -d) && grep -v '^SMTP_PASS=' .env > .env.tmp && printf 'SMTP_PASS=%s\n' \"\$NP\" >> .env.tmp && mv .env.tmp .env && pm2 restart ecosystem.config.js --only kraftak-prod --env production >/dev/null 2>&1 && sleep 3 && echo $JSB64 | base64 -d > _fixcheck.js && node _fixcheck.js; rm -f _fixcheck.js"
